<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="coffeeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.3"/></filter>
  </defs>
  <rect width="1200" height="400" rx="20" fill="#064e3b"/>
  <circle cx="1000" cy="200" r="180" fill="url(#coffeeGrad)" opacity="0.3" filter="blur(40px)"/>
  <g transform="translate(100, 130)">
    <text x="0" y="40" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="52" fill="#ecfdf5" filter="url(#shadow)">☕ COFFEE CRAFT KIOSK</text>
    <text x="0" y="90" font-family="'Segoe UI', sans-serif" font-size="22" fill="#a7f3d0">Điểm Bán Hàng Cảm Ứng &amp; Tự Động Hóa Order Quán Cà Phê</text>
    <rect x="0" y="130" width="220" height="48" rx="24" fill="#34d399"/>
    <text x="110" y="161" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="18" fill="#064e3b" text-anchor="middle">Touch To Order</text>
  </g>
  <g transform="translate(850, 70)" filter="url(#shadow)">
    <rect width="250" height="260" rx="20" fill="#047857" stroke="#059669" stroke-width="2"/>
    <circle cx="125" cy="90" r="45" fill="#ecfdf5"/>
    <text x="125" y="105" font-size="40" text-anchor="middle">🧋</text>
    <text x="125" y="170" font-family="sans-serif" font-weight="bold" font-size="20" fill="#ecfdf5" text-anchor="middle">Matcha Latte Đá</text>
    <text x="125" y="200" font-family="sans-serif" font-size="16" fill="#a7f3d0" text-anchor="middle">45.000đ • Size L</text>
  </g>
</svg>

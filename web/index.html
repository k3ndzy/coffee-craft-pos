<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Coffee Craft - Kiosk Tự Phục Vụ</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-emerald-950 text-emerald-50 min-h-screen">
  <header class="p-4 border-b border-emerald-800 bg-emerald-900 flex justify-between items-center">
    <h1 class="text-2xl font-black">☕ Coffee Craft Kiosk</h1>
    <div class="text-right"><span class="text-xs text-emerald-300">Số thứ tự hiện tại:</span><span class="text-xl font-bold ml-2 text-emerald-200">#042</span></div>
  </header>
  <main class="max-w-6xl mx-auto p-6 grid grid-cols-3 gap-6">
    <div class="col-span-2 grid grid-cols-2 gap-4">
      <div class="p-5 bg-emerald-900/60 border border-emerald-800 rounded-2xl hover:border-emerald-400 cursor-pointer">
        <span class="text-4xl">☕</span><h3 class="text-lg font-bold mt-2">Cà Phê Muối Kem Béo</h3><p class="text-emerald-400 font-bold">32.000đ</p>
      </div>
      <div class="p-5 bg-emerald-900/60 border border-emerald-800 rounded-2xl hover:border-emerald-400 cursor-pointer">
        <span class="text-4xl">🧋</span><h3 class="text-lg font-bold mt-2">Trà Sữa Trân Châu Ô Long</h3><p class="text-emerald-400 font-bold">42.000đ</p>
      </div>
      <div class="p-5 bg-emerald-900/60 border border-emerald-800 rounded-2xl hover:border-emerald-400 cursor-pointer">
        <span class="text-4xl">🍵</span><h3 class="text-lg font-bold mt-2">Matcha Espresso Fusion</h3><p class="text-emerald-400 font-bold">48.000đ</p>
      </div>
      <div class="p-5 bg-emerald-900/60 border border-emerald-800 rounded-2xl hover:border-emerald-400 cursor-pointer">
        <span class="text-4xl">🥐</span><h3 class="text-lg font-bold mt-2">Bánh Croissant Bơ Tỏi</h3><p class="text-emerald-400 font-bold">28.000đ</p>
      </div>
    </div>
    <div class="bg-emerald-900 p-6 rounded-2xl border border-emerald-800 space-y-4">
      <h3 class="font-bold text-lg border-b border-emerald-800 pb-2">Đơn Hàng Kiosk</h3>
      <div class="text-sm space-y-2">
        <div class="flex justify-between"><span>1x Cà Phê Muối (Size L, 50% Đường)</span><span>40.000đ</span></div>
        <div class="flex justify-between"><span>1x Bánh Croissant Bơ Tỏi</span><span>28.000đ</span></div>
      </div>
      <div class="border-t border-emerald-800 pt-4 flex justify-between font-bold text-lg"><span>Tổng Tiền:</span><span class="text-emerald-300">68.000đ</span></div>
      <button onclick="alert('Đã in hóa đơn! Số thứ tự của bạn là: #043')" class="w-full py-4 bg-emerald-400 hover:bg-emerald-300 text-emerald-950 font-black rounded-xl text-lg shadow-lg transition">CHẠM ĐỂ THANH TOÁN</button>
    </div>
  </main>
</body>
</html>
